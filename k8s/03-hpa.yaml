apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kura-crm-web
  namespace: kura-crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kura-crm-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
