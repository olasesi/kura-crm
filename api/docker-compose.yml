version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kura-crm-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: crm_user
      DB_PASSWORD: crm_password
      DB_NAME: crm_database
      DB_PORT: 3306
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: info
    volumes:
      - api_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - crm-network

  mysql:
    image: mysql:8.0
    container_name: kura-crm-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: crm_database
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10
    networks:
      - crm-network

  prometheus:
    image: prom/prometheus:latest
    container_name: kura-crm-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - crm-network

volumes:
  mysql_data:
  api_logs:
  prometheus_data:

networks:
  crm-network:
    driver: bridge
