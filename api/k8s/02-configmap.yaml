apiVersion: v1
kind: ConfigMap
metadata:
  name: kura-crm-config
  namespace: kura-crm
data:
  NODE_ENV: "production"
  PORT: "5000"
  DB_HOST: "kura-crm-mysql"
  DB_PORT: "3306"
  DB_NAME: "crm_database"
  CORS_ORIGIN: "https://app.kura-crm.com"
  LOG_LEVEL: "info"
  JWT_EXPIRES_IN: "15m"
  JWT_REFRESH_EXPIRES_IN: "7d"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "100"
  REDIS_URL: "redis://kura-crm-redis:6379"
  GRAPHQL_PATH: "/graphql"
  MAX_LOGIN_ATTEMPTS: "5"
  LOCKOUT_DURATION_MINUTES: "15"
  MFA_TOKEN_EXPIRES_IN: "5m"
  RECAPTCHA_SITE_KEY: ""
