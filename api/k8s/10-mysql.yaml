apiVersion: v1
kind: Service
metadata:
  name: kura-crm-mysql
  namespace: kura-crm
  labels:
    app: kura-crm
    tier: mysql
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
  selector:
    app: kura-crm
    tier: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kura-crm-mysql
  namespace: kura-crm
  labels:
    app: kura-crm
    tier: mysql
spec:
  serviceName: kura-crm-mysql
  replicas: 1
  selector:
    matchLabels:
      app: kura-crm
      tier: mysql
  template:
    metadata:
      labels:
        app: kura-crm
        tier: mysql
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kura-crm-secrets
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              value: "crm_database"
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: kura-crm-secrets
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kura-crm-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -u root -p$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysql -u$MYSQL_USER -p$MYSQL_PASSWORD -e 'SELECT 1'"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
