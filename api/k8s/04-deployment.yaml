apiVersion: apps/v1
kind: Deployment
metadata:
  name: kura-crm-api
  namespace: kura-crm
  labels:
    app: kura-crm
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kura-crm
      tier: api
  template:
    metadata:
      labels:
        app: kura-crm
        tier: api
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: registry.kura-crm.com/kura-crm-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kura-crm-config
            - secretRef:
                name: kura-crm-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
