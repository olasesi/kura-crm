apiVersion: v1
kind: Service
metadata:
  name: kura-crm-redis
  namespace: kura-crm
  labels:
    app: kura-crm
    tier: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: kura-crm
    tier: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kura-crm-redis
  namespace: kura-crm
  labels:
    app: kura-crm
    tier: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kura-crm
      tier: redis
  template:
    metadata:
      labels:
        app: kura-crm
        tier: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
