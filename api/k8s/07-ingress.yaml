apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kura-crm-ingress
  namespace: kura-crm
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit-rps: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.kura-crm.com
      secretName: kura-crm-tls
  rules:
    - host: api.kura-crm.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kura-crm-api
                port:
                  number: 5000
